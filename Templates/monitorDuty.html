<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty Monitor</title>
</head>
<body>

    <nav> 
        <a href="/monitor">Student</a>
        <a href="/dutyDashboard">Duty</a>
    </nav>

    <div style="display: flex; align-items: center; gap: 16px; margin-top: 16px;">

        {% if school_logo %}
            <img
                src="{{ school_logo }}"
                alt="{{ school }}"
                onerror="this.onerror=null; this.src='/static/logos/default.svg'"
                style="
                    height: 48px;
                    width: auto;
                    max-width: 100%;
                    object-fit: contain;
                "
            >
        {% endif %}

        <div>
            <h1>Duty Monitor</h1>
            <p>
                {{ area }}
                {% if school %}
                    &middot; {{ school }}
                {% endif %}
            </p>
        </div>

    </div>

    <p id="todayDate"></p>

    <h2>Duty Today (<span id="count">0</span>)</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Profile</th>
                <th>Name</th>
                <th>Time In</th>
                <th>Time Out</th>
            </tr>
        </thead>
        <tbody id="dutyTableBody"></tbody>
    </table>

    <p id="empty" hidden>No duty records yet today. Tap your RFID card to time in.</p>

    <p id="status"></p>

    <script src="/static/dutyScanner.js?v=2"></script>

</body>
</html>
